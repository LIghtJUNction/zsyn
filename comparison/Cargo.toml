[package]
name = "zsyn-comparison"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace]
resolver = "3"

[features]
default = ["oracle"]
oracle = ["dep:typst-syntax"]
allocation-stats = []

[dependencies]
zsyn = { path = "..", features = ["alloc"] }
typst-syntax = { version = "=0.15.1", optional = true }

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
required-features = ["oracle"]

[[bin]]
name = "dump"
path = "src/bin/dump.rs"
required-features = ["oracle"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
