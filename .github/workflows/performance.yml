name: Performance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -C target-cpu=x86-64
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and record environment
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          mkdir -p benchmark-results
          rustc --version --verbose > benchmark-results/environment.txt
          uname -a >> benchmark-results/environment.txt
          lscpu >> benchmark-results/environment.txt
          git rev-parse HEAD >> benchmark-results/environment.txt
      - name: Check syntax equivalence
        run: cargo test --locked --manifest-path comparison/Cargo.toml
      - name: Build the fixed-profile benchmark
        run: cargo build --release --locked --manifest-path comparison/Cargo.toml --bin benchmark
      - name: Measure parsing and first and repeated single-character edits
        run: |
          BENCH_CPU=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          /usr/bin/time -v -o benchmark-results/process-memory.txt taskset -c "$BENCH_CPU" comparison/target/release/benchmark > benchmark-results/timing.csv 2> benchmark-results/timing-metadata.txt
      - name: Measure allocations in a separate instrumented executable
        run: |
          cargo build --release --locked --manifest-path comparison/Cargo.toml --bin benchmark --features allocation-stats
          BENCH_CPU=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          taskset -c "$BENCH_CPU" comparison/target/release/benchmark > benchmark-results/memory.csv 2> benchmark-results/memory-metadata.txt
          python3 comparison/merge-results.py benchmark-results/timing.csv benchmark-results/memory.csv benchmark-results/results.csv
      - name: Retain raw results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zsyn-performance-${{ github.sha }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 90
