name: Release
run-name: Release / ${{ inputs.bump }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version increment; none publishes the current version'
        type: choice
        required: true
        default: patch
        options: [none, patch, minor, major]

permissions:
  contents: read

concurrency:
  group: zsyn-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'LIghtJUNction/zsyn' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      source: ${{ steps.plan.outputs.source }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate source and calculate version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: python scripts/release.py plan --bump "$RELEASE_BUMP"

  checks:
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.source }}
      version: ${{ needs.plan.outputs.version }}

  publish:
    needs: [plan, checks]
    if: github.repository == 'LIghtJUNction/zsyn' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Commit version, publish crate, and create release
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_SOURCE: ${{ needs.plan.outputs.source }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: python scripts/release.py publish --source "$RELEASE_SOURCE" --version "$RELEASE_VERSION"
      - name: Retain package and release status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.plan.outputs.tag }}-${{ github.run_attempt }}
          path: |
            target/release-state.json
            target/package/*.crate
          if-no-files-found: ignore
          retention-days: 30
